<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schafkopf Tracker</title>
    <script src="./chart.js"></script>
    <script src="./sweetalert.js"></script>
    <link rel="manifest" href="manifest.json" />
    <!-- <script src="script.js" defer></script> -->
    <script type="module">
      import { getVersion } from "./version.js";

      // Clear the reload flag after the page reloads
      if (localStorage.getItem("swUpdated")) {
        localStorage.removeItem("swUpdated");
      }

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").then((reg) => {
          fetch("https://tracker.florian-reichert.de/version.json", {
            cache: "reload",
          })
            .then((response) => response.json())
            .then((data) => console.log(data));

          reg.onupdatefound = () => {
            const newWorker = reg.installing;
            newWorker.onstatechange = () => {
              if (
                newWorker.state === "installed" &&
                navigator.serviceWorker.controller
              ) {
                console.log("Neue Version verfügbar!");

                // Prevent infinite reloads
                if (!localStorage.getItem("swUpdated")) {
                  localStorage.setItem("swUpdated", "true");
                  setTimeout(() => {
                    window.location.reload(); // Reload to fetch new files
                  }, 1000); // Shorter delay for testing
                }
              }
            };
          };
        });
      }

      async function displayVersion() {
        const version = await getVersion();
        document.getElementById("version").textContent = `V${version}`;
      }

      displayVersion();
    </script>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
      }
      .button {
        padding: 10px;
        margin: 5px;
        font-size: 16px;
        cursor: pointer;
        min-width: 100px;
        border: none;
        border-radius: 5px;
      }
      .green {
        background-color: #3ed600;
        color: white;
      }
      .red {
        background-color: #f72b2b;
        color: white;
      }
      .blue {
        background-color: #16b1ff;
        color: white;
      }
      footer {
        position: fixed;
        bottom: 0;
        width: 100%;
        background-color: #f1f1f1;
        text-align: center;
        padding: 10px 0;
        font-size: 12px;
        color: #555;
      }
      .spacer {
        height: 50px;
        min-height: 50px;
      }
      .hidden {
        visibility: none;
      }
    </style>
  </head>
  <body>
    <h1>Bilanz: <span id="balance">0.00</span></h1>
    <div>Ausgewählt: <span id="selectedAmount"></span></div>
    <div>
      <button class="button blue" onclick="addAmount(0.10)">0,10 €</button>
      <button class="button blue" onclick="addAmount(0.20)">0,20 €</button>
      <button class="button blue" onclick="addAmount(0.50)">0,50 €</button>
      <button class="button blue" onclick="resetChoice()">Zurücksetzen</button>
    </div>
    <div>
      <button class="button green" onclick="confirmTransaction('plus')">
        +
      </button>
      <button class="button red" onclick="confirmTransaction('minus')">
        -
      </button>
    </div>
    <canvas id="chart" width="400" height="500"></canvas>
    <div>
      <button
        class="button"
        id="deleteLastRoundButton"
        onclick="deleteLastRound()"
      >
        Runde löschen
      </button>
      <button class="button" id="resetButton" onclick="reset()">Reset</button>
      <!-- <button
        class="button"
        id="updateAvailableButton"
        onclick="updateServiceWorker()"
      >
        Update verfügbar
      </button> -->
    </div>
    <div class="spacer"></div>
    <footer id="version">Loading...</footer>

    <script>
      // function updateServiceWorker() {
      //   if ("serviceWorker" in navigator) {
      //     navigator.serviceWorker.getRegistrations().then((registrations) => {
      //       for (let reg of registrations) {
      //         reg.update().then(() => {
      //           console.log("Service Worker wurde aktualisiert.");
      //           window.location.reload();
      //         });
      //       }
      //     });
      //   }
      // }
      var resetButton = document.getElementById("resetButton");
      var deleteLastRoundButton = document.getElementById(
        "deleteLastRoundButton"
      );

      let balance = parseFloat(localStorage.getItem("balance")) || 0;
      let history = JSON.parse(localStorage.getItem("history")) || [];
      let tempAmount = 0;
      updateSelectedAmount(tempAmount);
      const balanceElement = document.getElementById("balance");
      const ctx = document.getElementById("chart").getContext("2d");

      let chart = new Chart(ctx, {
        type: "line",
        data: {
          labels: history.map((_, i) => `Runde ${i + 1}`),
          datasets: [
            {
              label: "Bilanz",
              data: history,
              borderColor: "blue",
              fill: false,
            },
          ],
        },
        options: {
          responsive: true,
          scales: {
            x: { display: true },
            y: { display: true },
          },
        },
      });

      updateBalance(balance);

      function updateBalance(balance) {
        balanceElement.innerText = parseFloat(balance).toLocaleString("de-DE", {
          style: "currency",
          currency: "EUR",
        });
      }

      function updateSelectedAmount(tempAmount) {
        var value = parseFloat(tempAmount).toLocaleString("de-DE", {
          style: "currency",
          currency: "EUR",
        });
        document.getElementById("selectedAmount").innerText = value;
      }

      function reset() {
        if (history.length == 0) {
          return;
        }

        Swal.fire({
          title: "Wollen Sie wirklich alle Runden löschen?",
          text: "Dies kann nicht mehr rückgängig gemacht werden!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#3085d6",
          cancelButtonColor: "#d33",
          confirmButtonText: "Ja, löschen!",
        }).then((result) => {
          if (result.isConfirmed) {
            Swal.fire({
              title: "Gelöscht!",
              text: "Alle Runden wurde gelöscht.",
              icon: "success",
              timer: 1200,
              timerProgressBar: true,
              didOpen: () => {
                // Swal.showLoading();
                const timer = Swal.getPopup().querySelector("b");
                timerInterval = setInterval(() => {
                  timer.textContent = `${Swal.getTimerLeft()}`;
                }, 100);
              },
              willClose: () => {
                clearInterval(timerInterval);
              },
            });

            // Functionality here
            tempAmount = 0;
            balance = 0;
            history = [];
            updateLocalStorage();
            updateBalance(balance);
            updateChart();
            updateSelectedAmount(tempAmount);
          }
        });
      }

      function addAmount(amount) {
        tempAmount += amount;
        updateSelectedAmount(tempAmount);
      }

      function deleteLastRound() {
        if (history.length == 0) {
          return;
        }

        Swal.fire({
          title: "Wollen Sie die letzte Runde wirklich löschen?",
          text: "Dies kann nicht mehr rückgängig gemacht werden!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#3085d6",
          cancelButtonColor: "#d33",
          confirmButtonText: "Ja, löschen!",
        }).then((result) => {
          if (result.isConfirmed) {
            Swal.fire({
              title: "Gelöscht!",
              text: "Die letzte Runde wurde gelöscht.",
              icon: "success",
              timer: 1200,
              timerProgressBar: true,
              didOpen: () => {
                // Swal.showLoading();
                const timer = Swal.getPopup().querySelector("b");
                timerInterval = setInterval(() => {
                  timer.textContent = `${Swal.getTimerLeft()}`;
                }, 100);
              },
              willClose: () => {
                clearInterval(timerInterval);
              },
            });

            // Functionality here
            history.pop();
            if (history.length != 0) {
              balance = history[history.length - 1];
            } else {
              balance = 0;
            }

            updateBalance(balance);
            updateSelectedAmount(tempAmount);
            updateLocalStorage();
            updateChart();
          }
        });
      }

      function resetChoice() {
        tempAmount = 0;
        updateSelectedAmount(tempAmount);
      }

      function confirmTransaction(type) {
        balance = type === "plus" ? balance + tempAmount : balance - tempAmount;
        console.log(balance);
        balance = Math.round(balance * 100) / 100;
        history.push(balance);
        updateBalance(balance);
        updateLocalStorage();
        updateChart();
        tempAmount = 0;
        updateSelectedAmount(tempAmount);
      }

      function updateLocalStorage() {
        localStorage.setItem("balance", balance);
        localStorage.setItem("history", JSON.stringify(history));
      }

      function updateChart() {
        chart.data.labels = history.map((_, i) => `Runde ${i + 1}`);
        chart.data.datasets[0].data = history;
        chart.update();
      }
    </script>
  </body>
</html>

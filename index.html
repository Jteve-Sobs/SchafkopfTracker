<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schafkopf Tracker</title>
    <script src="./chart.js"></script>
    <script src="./sweetalert.js"></script>
    <link rel="manifest" href="manifest.json" />
    <script type="module" src="init.js"></script>
    <script type="module" src="js/main.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button id="toggleDark">🌗</button>
    <h1>Bilanz: <span id="balance">0.00</span></h1>
    <!-- todo: add legacy option -->
    <!-- <div>Ausgewählt: <span id="selectedAmount"></span></div>
    <div>
      <button class="button blue" onclick="addAmount(0.10)">0,10 €</button>
      <button class="button blue" onclick="addAmount(0.20)">0,20 €</button>
      <button class="button blue" onclick="addAmount(0.50)">0,50 €</button>
      <button class="button blue" onclick="resetChoice()">Zurücksetzen</button>
    </div>
    <div>
      <button class="button green" onclick="confirmTransaction('plus')">
        +
      </button>
      <button class="button red" onclick="confirmTransaction('minus')">
        -
      </button>
    </div> -->
    <div class="selectorButtons">
      <button class="buttonSmol blue" id="Ramsch">Ramsch</button>
      <button class="buttonSmol blue" data-type="default" id="Sauspiel">
        Sauspiel
      </button>
      <button class="buttonSmol blue" id="Geier">Geier</button>
      <button class="buttonSmol blue" id="Wenz">Wenz</button>
      <button class="buttonSmol blue" id="Solo">Solo</button>
      <button class="buttonSmol blue" id="Sie">Sie</button>
    </div>
    <div class="selectorButtons">
      <button class="buttonSmol blue" data-type="default" id="Spieler">
        Spieler
      </button>
      <button class="buttonSmol blue" id="Mitspieler">Mitspieler</button>
      <button class="buttonSmol blue">Nichtspieler</button>
    </div>
    <div class="selectorButtons">
      <button class="buttonSmol blue" data-type="default" id="Schneiderfrei">
        Schneiderfrei
      </button>
      <button class="buttonSmol blue" id="Schneider">Schneider</button>
      <button class="buttonSmol blue" id="Schwarz">Schwarz</button>
      <button class="buttonSmol blue" id="Tout">Tout</button>
    </div>
    <div class="selectorButtons" id="resultButtons">
      <button class="buttonSmol blue" data-type="default">Gewonnen</button>
      <button class="buttonSmol blue">Verloren</button>
      <!-- Nur bei Ramsch wählbar: niemand zahlt/bekommt etwas -->
      <button class="buttonSmol blue" id="OhneGeld">Ohne Geld</button>
    </div>
    <div class="marginTop">
      <button class="buttonSmol" onclick="adjustAmount('-')">-</button>
      <span class="input-wrapper">
        <input
          type="text"
          placeholder="0,00"
          inputmode="numeric"
          pattern="^-?\d+(?:[,.]\d{1,2})?[ \xA0]?€?$"
        />
        <!-- in regex there is the non-breaking space (from formatCurrency function) -->
        <button class="clear-btn" type="button" id="clearBtn">✖</button>
      </span>
      <button class="buttonSmol" onclick="adjustAmount('+')">+</button>
      <button
        class="buttonSmol blue bordered"
        onclick="confirmTransaction()"
        id="confirmButton"
      >
        Hinzufügen
      </button>
    </div>
    <canvas id="chart" width="400" height="500"></canvas>
    <div>
      <button
        class="button"
        id="deleteLastRoundButton"
        onclick="deleteLastRound()"
      >
        Runde löschen
      </button>
      <button class="button" id="resetButton" onclick="reset()">Reset</button>
    </div>
    <div>
      <button class="button" id="exportHistoryButton">Export</button>
      <button class="button" id="importHistoryButton">Import</button>
      <input
        type="file"
        id="importHistoryFile"
        accept=".json"
        style="display: none"
      />
    </div>
    <div>
      <button class="button" id="showStatsBtn">📊 Statistik</button>
    </div>
    <div>
      <!-- Archiv Button -->
      <button class="button" id="archiveButton">Archivieren</button>

      <!-- Archivierte Daten anzeigen -->
      <h4>Archivierte Daten</h4>
      <ul id="archiveList"></ul>
    </div>
    <div class="spacer"></div>
    <div class="spacer"></div>
    <!-- POPUP MODAL -->
    <div id="statsModal" class="modal">
      <div class="modal-content">
        <span class="close" id="closeModal">&times;</span>
        <h1>Spielauswertung</h1>
        <div id="currentStats"></div>
        <div id="allStats"></div>
        <div id="archiveStats"></div>
      </div>
    </div>
    <footer id="version">Loading...</footer>
  </body>
</html>

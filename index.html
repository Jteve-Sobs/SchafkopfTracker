<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schafkopf Tracker</title>
    <script src="./chart.js"></script>
    <script src="./sweetalert.js"></script>
    <link rel="manifest" href="manifest.json" />
    <!-- <script src="script.js" defer></script> -->
    <script type="module">
      import { getVersion } from "./version.js";

      // Clear the reload flag after the page reloads
      if (localStorage.getItem("swUpdated")) {
        localStorage.removeItem("swUpdated");
      }

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").then((reg) => {
          fetch("https://tracker.florian-reichert.de/version.json", {
            cache: "reload",
          }).then((response) => response.json());
          // .then((data) => console.log(data));

          reg.onupdatefound = () => {
            const newWorker = reg.installing;
            newWorker.onstatechange = () => {
              if (
                newWorker.state === "installed" &&
                navigator.serviceWorker.controller
              ) {
                console.log("Neue Version verfügbar!");

                // Prevent infinite reloads
                if (!localStorage.getItem("swUpdated")) {
                  localStorage.setItem("swUpdated", "true");
                  setTimeout(() => {
                    window.location.reload(); // Reload to fetch new files
                  }, 1000); // Shorter delay for testing
                }
              }
            };
          };
        });
      }

      async function displayVersion() {
        const version = await getVersion();
        document.getElementById("version").textContent = `V${version}`;
      }

      displayVersion();
    </script>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
      }
      h1 {
        font-size: 30px;
        margin: 15px 0;
      }
      .button {
        padding: 10px;
        margin: 5px;
        font-size: 16px;
        cursor: pointer;
        min-width: 100px;
        border: none;
        border-radius: 5px;
      }
      .buttonSmol {
        padding: 5px;
        margin: 2px 0px;
        font-size: 14px;
        cursor: pointer;
        min-width: 40px;
        max-width: 95px;
        border: none;
        border-radius: 5px;
      }
      .green {
        background-color: #3ed600;
        color: white;
      }
      .red {
        background-color: #f72b2b;
        color: white;
      }
      .blue {
        background-color: #16a1e7;
        color: white;
      }
      .active {
        background-color: #0073ad;
      }
      footer {
        position: fixed;
        bottom: 0;
        width: 100%;
        background-color: #f1f1f1;
        text-align: center;
        padding: 10px 0;
        font-size: 12px;
        color: #555;
      }
      .spacer {
        height: 1em;
        min-height: 1em;
      }
      .hidden {
        visibility: none;
      }
      input {
        text-align: center;
        padding: 5px;
        margin: 2px;
        font-size: 14px;
        cursor: pointer;
        min-width: 40px;
        max-width: 90px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

  <body>
    <h1>Bilanz: <span id="balance">0.00</span></h1>
    <!-- todo: add legacy option -->
    <!-- <div>Ausgewählt: <span id="selectedAmount"></span></div>
    <div>
      <button class="button blue" onclick="addAmount(0.10)">0,10 €</button>
      <button class="button blue" onclick="addAmount(0.20)">0,20 €</button>
      <button class="button blue" onclick="addAmount(0.50)">0,50 €</button>
      <button class="button blue" onclick="resetChoice()">Zurücksetzen</button>
    </div>
    <div>
      <button class="button green" onclick="confirmTransaction('plus')">
        +
      </button>
      <button class="button red" onclick="confirmTransaction('minus')">
        -
      </button>
    </div> -->
    <div class="selectorButtons">
      <button class="buttonSmol blue">Ramsch</button>
      <!-- todo: bei Ausgewähltem Ramsch die Buttons für Typ anpassen -->
      <!-- todo: Text aus JS? -->
      <button class="buttonSmol blue" data-type="default">Sauspiel</button>
      <button class="buttonSmol blue">Geier/Wenz</button>
      <button class="buttonSmol blue">Solo</button>
      <button class="buttonSmol blue">Sie</button>
    </div>
    <!-- todo: buttons deaktivieren abhängig vom Spielmodus -->
    <div class="selectorButtons">
      <button class="buttonSmol blue" data-type="default">Spieler</button>
      <button class="buttonSmol blue">Nichtspieler</button>
    </div>
    <div class="selectorButtons">
      <button class="buttonSmol blue" data-type="default">Schneiderfrei</button>
      <button class="buttonSmol blue">Schneider</button>
      <button class="buttonSmol blue">Schwarz</button>
      <button class="buttonSmol blue">Tout</button>
      <!-- todo: Tour nur bei Geier/Wenz und Solo anzeigen -->
    </div>
    <div class="selectorButtons">
      <button class="buttonSmol blue" data-type="default">Gewonnen</button>
      <button class="buttonSmol blue">Verloren</button>
      <!-- todo: für Ramsch muss hier eine Option rein, um ohne Geld aus dem Match rauszugehen -->
    </div>
    <div>
      <!-- <button class="buttonSmol" onclick="adjustAmount('-')">-0,10 €</button> -->
      <input type="text" placeholder="0,00" />
      <!-- <button class="buttonSmol" onclick="adjustAmount('+')">+0,10 €</button> -->
      <button class="buttonSmol" onclick="confirmTransaction()">
        Hinzufügen
      </button>
    </div>
    <canvas id="chart" width="400" height="500"></canvas>
    <div>
      <button
        class="button"
        id="deleteLastRoundButton"
        onclick="deleteLastRound()"
      >
        Runde löschen
      </button>
      <button class="button" id="resetButton" onclick="reset()">Reset</button>
    </div>
    <div class="spacer"></div>
    <footer id="version">Loading...</footer>

    <script>
      let tempAmount = 0;
      resetSelectorButtonsActionvationToDefault();
      function resetSelectorButtonsActionvationToDefault() {
        const buttons = document.querySelectorAll(".selectorButtons");
        buttons.forEach((button) => {
          button.querySelectorAll(".buttonSmol").forEach((btn) => {
            btn.classList.remove("active");
          });
          button.querySelector('[data-type="default"]').classList.add("active");
        });
        updateAmount();
      }

      // Buttons for selecting amount
      function adjustAmount(sign) {
        const inputField = document.querySelector("input");
        let currentValue = parseFloat(inputField.value.replace(",", "."));
        if (isNaN(currentValue)) {
          currentValue = 0;
        }
        const adjustment = sign === "+" ? 0.1 : -0.1;
        const newValue = (currentValue + adjustment).toFixed(2);
        inputField.value = newValue.replace(".", ",") + " €"; //todo: manuelle Eingabe geht noch nicht //todo: nur Zahlen ermöglichen und Zahlenpad Eingabe aktivieren
      }

      function updateAmount() {
        // Spielarten mit ihren Grundbeträgen
        const gameValues = {
          Ramsch: 0.1,
          Sauspiel: 0.2,
          "Geier/Wenz": 0.3,
          Solo: 0.4,
          Sie: 1.6,
        };

        // Multiplikatoren für Schneider und Schwarz
        const multipliers = {
          Schneiderfrei: 1,
          Schneider: 2,
          Schwarz: 4,
          Tout: 8,
        };

        // Spielauswahl
        let selctorsButtons = document.querySelectorAll(".selectorButtons");
        let selectedGame = selctorsButtons[0]
          .querySelector(".active")
          ?.textContent.trim();
        let selectedPlayType = selctorsButtons[1]
          .querySelector(".active")
          ?.textContent.trim();
        let selectedMultiplier = selctorsButtons[2]
          .querySelector(".active")
          ?.textContent.trim();
        let selectedResult = selctorsButtons[3]
          .querySelector(".active")
          ?.textContent.trim();

        let baseAmount = gameValues[selectedGame] || 0;
        let multiplier = multipliers[selectedMultiplier] || 1;
        let amount = baseAmount * multiplier;

        // Wenn verloren und ein bestimmtes Spiel, dann nochmal x3
        if (
          selectedPlayType === "Spieler" &&
          ["Ramsch", "Geier/Wenz", "Solo", "Sie"].includes(selectedGame)
        ) {
          amount *= 3;
        }

        // Ramsch als Nichtspieler verlieren
        if (
          selectedPlayType === "Nichtspieler" &&
          selectedResult === "Verloren" &&
          "Ramsch".includes(selectedGame)
        ) {
          amount *= 2;
        }

        // Gewinn oder Verlust berechnen
        if (selectedResult === "Verloren") {
          amount *= -1;
        }

        // Betrag in das Input-Feld schreiben
        document.querySelector("input").value =
          amount.toFixed(2).replace(".", ",") + " €";
        tempAmount = amount;
      }

      // Initiale Berechnung beim Laden
      updateAmount();

      document.querySelectorAll(".selectorButtons").forEach((div) => {
        div.addEventListener("click", (event) => {
          if (event.target.classList.contains("buttonSmol")) {
            div
              .querySelectorAll(".buttonSmol")
              .forEach((btn) => btn.classList.remove("active"));
            event.target.classList.add("active");
            updateAmount();
          }
        });
      });

      var resetButton = document.getElementById("resetButton");
      var deleteLastRoundButton = document.getElementById(
        "deleteLastRoundButton"
      );

      let balance = parseFloat(localStorage.getItem("balance")) || 0;
      let history = JSON.parse(localStorage.getItem("history")) || [0];

      updateSelectedAmount(tempAmount);

      setDeleteButtonsEnabled();

      const balanceElement = document.getElementById("balance");

      const ctx = document.getElementById("chart").getContext("2d");

      var borderColor = balance < 0 ? "red" : "green";
      let chart = new Chart(ctx, {
        type: "line",
        data: {
          labels: history.map((_, i) => `Runde ${i + 1}`),
          datasets: [
            {
              label: "Bilanz",
              data: history,
              borderColor: borderColor,
              fill: false,
              pointhoverradius: 10,
              hitRadius: 10,
            },
          ],
        },
        options: {
          responsive: true,
          scales: {
            x: { display: true },
            y: {
              display: true,
              ticks: {
                callback: function (value, index, values) {
                  return formatCurrency(value);
                },
              },
              grid: {
                // thicker line at y=0
                drawBorder: true,
                color: (context) =>
                  context.tick.value === 0 ? "black" : "rgba(0, 0, 0, 0.1)",
                lineWidth: (context) => (context.tick.value === 0 ? 1.01 : 1),
              },
            },
          },
          plugins: {
            legend: {
              display: false, // Hides the legend
            },
            tooltip: {
              callbacks: {
                label: function (context) {
                  // handle the start value differently
                  if (context.dataIndex === 0) {
                    return "Gesamt: " + formatCurrency(context.parsed.y);
                  } else {
                    return [
                      "Gesamt: " + formatCurrency(context.parsed.y),
                      "Differenz: " +
                        formatCurrency(
                          context.parsed.y -
                            context.dataset.data[context.dataIndex - 1]
                        ),
                    ];
                  }
                },
              },
              title: function (context) {
                return `Runde ${context[0].dataIndex + 1}`;
              },
            },
          },
        },
      });
      updateChart();

      updateBalance(balance);

      function formatCurrency(value) {
        return parseFloat(value).toLocaleString("de-DE", {
          style: "currency",
          currency: "EUR",
        });
      }

      function updateBalance(balance) {
        balanceElement.innerText = formatCurrency(balance);
      }

      function updateSelectedAmount(tempAmount) {
        if (document.getElementById("selectedAmount") === null) {
          return;
        }
        // todo: create function to format currency
        var value = formatCurrency(tempAmount);
        document.getElementById("selectedAmount").innerText = value;
      }

      function reset() {
        if (history.length <= 1) {
          return;
        }

        Swal.fire({
          title: "Wollen Sie wirklich alle Runden löschen?",
          text: "Dies kann nicht mehr rückgängig gemacht werden!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#3085d6",
          cancelButtonColor: "#d33",
          confirmButtonText: "Ja, löschen!",
        }).then((result) => {
          if (result.isConfirmed) {
            Swal.fire({
              title: "Gelöscht!",
              text: "Alle Runden wurde gelöscht.",
              icon: "success",
              timer: 1200,
              timerProgressBar: true,
              toast: true,
              position: "bottom",
              didOpen: () => {
                // Swal.showLoading();
                const timer = Swal.getPopup().querySelector("b");
                timerInterval = setInterval(() => {
                  timer.textContent = `${Swal.getTimerLeft()}`;
                }, 100);
              },
              willClose: () => {
                clearInterval(timerInterval);
              },
            });

            // Functionality here
            tempAmount = 0;
            balance = 0;
            history = [0];
            updateLocalStorage();
            updateBalance(balance);
            updateChart();
            updateSelectedAmount(tempAmount);
          }
        });
      }

      function addAmount(amount) {
        tempAmount += amount;
        updateSelectedAmount(tempAmount);
      }

      function deleteLastRound() {
        if (history.length <= 1) {
          return;
        }

        Swal.fire({
          title: "Wollen Sie die letzte Runde wirklich löschen?",
          text: "Dies kann nicht mehr rückgängig gemacht werden!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#3085d6",
          cancelButtonColor: "#d33",
          confirmButtonText: "Ja, löschen!",
        }).then((result) => {
          if (result.isConfirmed) {
            Swal.fire({
              title: "Gelöscht!",
              text: "Die letzte Runde wurde gelöscht.",
              icon: "success",
              timer: 1200,
              timerProgressBar: true,
              toast: true,
              position: "bottom",
              didOpen: () => {
                // Swal.showLoading();
                const timer = Swal.getPopup().querySelector("b");
                timerInterval = setInterval(() => {
                  timer.textContent = `${Swal.getTimerLeft()}`;
                }, 100);
              },
              willClose: () => {
                clearInterval(timerInterval);
              },
            });

            // Functionality here
            history.pop();
            if (history.length > 1) {
              balance = history[history.length - 1];
            } else {
              balance = 0;
            }

            updateBalance(balance);
            updateSelectedAmount(tempAmount);
            updateLocalStorage();
            updateChart();
          }
        });
      }

      function resetChoice() {
        tempAmount = 0;
        updateSelectedAmount(tempAmount);
      }

      function confirmTransaction(type = "plus") {
        balance = type === "plus" ? balance + tempAmount : balance - tempAmount;
        balance = Math.round(balance * 100) / 100;
        history.push(balance);
        updateBalance(balance);
        updateLocalStorage();
        updateChart();
        // tempAmount = 0;
        resetSelectorButtonsActionvationToDefault();

        updateSelectedAmount(tempAmount);
      }

      function updateLocalStorage() {
        localStorage.setItem("balance", balance);
        localStorage.setItem("history", JSON.stringify(history));

        setDeleteButtonsEnabled();
      }

      function setDeleteButtonsEnabled() {
        if (history.length > 1) {
          resetButton.disabled = false;
          deleteLastRoundButton.disabled = false;
        } else {
          resetButton.disabled = true;
          deleteLastRoundButton.disabled = true;
        }
      }

      function updateChart() {
        chart.data.labels = history.map((_, i) => `Runde ${i}`);
        chart.data.labels[0] = "Start";
        chart.data.datasets[0].data = history;

        var borderColor = balance < 0 ? "red" : "green";
        chart.data.datasets[0].borderColor = borderColor;

        chart.update();
      }
    </script>
  </body>
</html>
